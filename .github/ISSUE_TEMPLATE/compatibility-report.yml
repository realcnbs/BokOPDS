name: Report device compatibility
description: Tell us whether BokOPDS worked on your model and firmware.
title: "[Compatibility] Model / firmware"
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing BokOPDS. Before submitting, remove serial numbers, catalog addresses, credentials, book-library details, and other personal information.
  - type: input
    id: model
    attributes:
      label: Reader model
      placeholder: Kobo Elipsa 2E
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware ID, if known
      description: This is the short numeric model ID, not the serial number. Leave it blank if you are unsure.
      placeholder: "389"
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      placeholder: 4.38.23697
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BokOPDS version
      placeholder: 0.5.9
    validations:
      required: true
  - type: checkboxes
    id: results
    attributes:
      label: Test results
      options:
        - label: The installation finished and one BokOPDS item appeared.
        - label: Open, close, reopen, sleep, wake, and frontlight all worked.
        - label: Wi-Fi, catalog browsing, search, and keyboard switching worked.
        - label: A downloaded book appeared in the built-in library after closing BokOPDS.
        - label: USB connection and return to the standard interface worked.
        - label: I tested uninstalling or recovery.
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: Describe failures and attach useful logs or photos after removing private information.
    validations:
      required: true
